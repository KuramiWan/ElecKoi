<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="eleckoi-author-api" content="0.1.0">
  <title>积分设置</title>
  <style>
    body { margin: 20px; font: 14px/1.6 system-ui; color: #202124; background: #fff; }
    form { display: grid; gap: 16px; max-width: 420px; }
    label { display: grid; gap: 4px; }
    input, button { box-sizing: border-box; font: inherit; padding: 8px; min-height: 40px; }
    output { display: block; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <form>
    <label>积分倍率<input id="multiplier" type="number" min="0.1" step="0.1" required disabled></label>
    <button disabled>保存</button>
    <output role="status"></output>
  </form>
  <script type="module">
    const form = document.querySelector('form'), field = document.querySelector('input');
    const button = document.querySelector('button'), output = document.querySelector('output');
    try {
      const api = await window.ElecKoiReady;
      let settings = await api.script.getSettings();
      field.value = settings.values.multiplier ?? 2;
      field.disabled = button.disabled = false;
      form.addEventListener('submit', async event => {
        event.preventDefault(); button.disabled = true;
        try {
          const multiplier = Number(field.value);
          if (!Number.isFinite(multiplier) || multiplier <= 0) throw new Error('倍率必须是正有限数字');
          settings = await api.script.setSettings({ ...settings.values, multiplier }, settings.revision);
          output.textContent = '已保存';
        } catch (error) {
          output.textContent = error.message;
          try { settings = await api.script.getSettings(); }
          catch (refreshError) { output.textContent += `；重新读取失败：${refreshError.message}`; }
        } finally { button.disabled = false; }
      });
    } catch (error) { output.textContent = error.message; }
  </script>
</body>
</html>
