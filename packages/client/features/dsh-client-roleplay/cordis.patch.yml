- id: spill-local
  disabled: true

- id: spill-policy
  config:
    maxInlineTokens: 12500
    pagedTools: [eleckoi_read_setting_files, eleckoi_read_variables, eleckoi_call_capability, eleckoi_read_uploaded_file]

- insert:
    - id: eleckoi-tool-result-store
      name: '@eleckoi/dsh-client-roleplay/host/tool-result-store.mjs'
      config:
        root: !!js dshHomePath('tool-results')

    - id: eleckoi-client-roleplay
      name: '@eleckoi/dsh-client-roleplay'
